# ==============================================================================
# Docker Compose Configurations
#
# 1. Local Development & Testing:
#    Run: pnpm test:db:up / pnpm test:db:down (or `docker compose up -d postgres`)
#    - Published host port (5432:5432)
#    - Simple developer password ('postgres')
#    - Auto-provisions both dev ('config_platform') and test ('config_platform_test') DBs
#
# 2. Customer-Facing Example Stack:
#    Run: docker compose --profile customer up -d (or `docker compose -f docker-compose.customer.yml up -d`)
#    - NO published database host ports (internal network only)
#    - Strong password generated/passed via DB_PASSWORD environment variable
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Development & Testing Database (Local developer machine)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: config-platform-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: config_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Customer-Facing Example (Production / Self-Hosted Stack)
  # Database is isolated to internal network: NO published host ports, strong secret.
  # ----------------------------------------------------------------------------
  postgres-customer:
    image: postgres:16-alpine
    container_name: config-platform-customer-db
    restart: always
    profiles: ["customer"]
    environment:
      POSTGRES_USER: ${DB_USER:-config_platform_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-config_platform}
    # Security: No published ports on the host machine; accessible only via customer_internal network
    expose:
      - "5432"
    volumes:
      - postgres_customer_data:/var/lib/postgresql/data
    networks:
      - customer_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-config_platform_user} -d $${POSTGRES_DB:-config_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-customer:
    image: config-platform:latest
    container_name: config-platform-customer-app
    restart: always
    profiles: ["customer"]
    depends_on:
      postgres-customer:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${DB_USER:-config_platform_user}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres-customer:5432/${DB_NAME:-config_platform}?sslmode=disable
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be set}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL must be set}
    networks:
      - customer_internal

networks:
  customer_internal:
    internal: false

volumes:
  postgres_dev_data:
  postgres_customer_data:
